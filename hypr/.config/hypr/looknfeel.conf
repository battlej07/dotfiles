source=./colourpalette.conf

general {
  border_size = 2

  gaps_in = 5
  gaps_out = 10
  gaps_workspaces = 5

  col.active_border = rgb($Green)
  col.inactive_border = rgb($Grey0)

  no_focus_fallback = true

  resize_on_border = true

  allow_tearing = true
}

decoration {
  rounding = 8
  rounding_power = 4

  shadow {
    color = rgb($Grey1)
    color_inactive = rgb($Grey2)
  }
}

animations {
  workspace_wraparound = false # false

  animation = windows, 1, 4, default, slide
  animation = layers, 1, 4, default, slide
  animation = workspaces, 1, 4, default, slide
}

dwindle {
  preserve_split = true
}

disable_hyprland_logo = true
font_family = "JetBrainsMono Nerd Font"
splash_font_family = "JetBrainsMono Nerd Font"
