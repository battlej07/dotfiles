windowrule {
  name = launcher
  match:class = sway-launcher-desktop

  float = true
  size = 500 500
  center = true
  stay_focused = true
  dim_around = true
}

windowrule {
    name = floating-tuis
    match:class = ^(floating-tui|com\.gabm\.satty)$

    float = true
    size = 1200 700
    center = true
}

windowrule {
  name = powermenu
  match:class = powermenu

  float = true
  size = 200 150
  center = true
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}
